<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>力的合成与分解动态演示（修复Y轴反向）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",SimHei,sans-serif;}
body{background:#f4f7fc;padding:24px;}
h1{text-align:center;color:#1a4799;margin-bottom:20px;font-size:32px;}
.wrap{max-width:1300px;margin:0 auto;background:#fff;padding:25px;border-radius:10px;box-shadow:0 2px 14px #d1d9e8;}
.tab-box{display:flex;gap:12px;margin-bottom:18px;}
.tab{padding:9px 26px;border:none;border-radius:6px;background:#c8d8f2;color:#1a4799;font-size:17px;cursor:pointer;}
.tab.active{background:#1a4799;color:#fff;}
.content-row{display:flex;gap:25px;}
.ctrl-panel{width:400px;padding:18px;background:#f7faff;border-radius:8px;}
.canvas-box{flex:1;}
canvas{border:1px solid #999;background:#fdfdfd;display:block;margin:0 auto;}
.ctrl-item{margin:14px 0;}
.ctrl-item label{display:block;margin-bottom:6px;font-size:17px;color:#222;}
input[type="range"]{width:100%;}
.val-show{color:#c41e3a;font-weight:bold;font-size:18px;margin-left:8px;}
.desc{margin-top:14px;font-size:16px;line-height:1.7;color:#333;}
.hide{display:none;}
</style>
</head>
<body>
<div class="wrap">
    <h1>力的平行四边形定则｜合成 & 分解演示（Y轴修正）</h1>
    <div class="tab-box">
        <button class="tab active" id="tabAdd">力的合成</button>
        <button class="tab" id="tabSplit">力的分解</button>
    </div>
    <div class="content-row">
        <!-- 控制面板 -->
        <div class="ctrl-panel">
            <!-- 合成控制区 -->
            <div id="ctrlAdd">
                <div class="ctrl-item">
                    <label>分力 F₁ = <span class="val-show" id="f1Val">30</span> N</label>
                    <input type="range" min="10" max="80" value="30" id="f1">
                </div>
                <div class="ctrl-item">
                    <label>F₁ 与x轴夹角 = <span class="val-show" id="ang1Val">30</span> °</label>
                    <input type="range" min="0" max="90" value="30" id="ang1">
                </div>
                <div class="ctrl-item">
                    <label>分力 F₂ = <span class="val-show" id="f2Val">40</span> N</label>
                    <input type="range" min="10" max="80" value="40" id="f2">
                </div>
                <div class="ctrl-item">
                    <label>F₂ 与x轴夹角 = <span class="val-show" id="ang2Val">-30</span> °</label>
                    <input type="range" min="-90" max="0" value="-30" id="ang2">
                </div>
                <div class="desc">
                    两分力总夹角：<span class="val-show" id="totalAng">60</span> °<br>
                    合力大小：<span class="val-show" id="resAdd">计算中</span> N
                </div>
            </div>
            <!-- 分解控制区 -->
            <div id="ctrlSplit" class="hide">
                <div class="ctrl-item">
                    <label>合力 F合 = <span class="val-show" id="fTotalVal">50</span> N</label>
                    <input type="range" min="20" max="90" value="50" id="fTotal">
                </div>
                <div class="ctrl-item">
                    <label>分力F₁与x轴夹角 = <span class="val-show" id="splitAng1Val">45</span> °</label>
                    <input type="range" min="10" max="80" value="45" id="splitAng1">
                </div>
                <div class="ctrl-item">
                    <label>分力F₂与x轴夹角 = <span class="val-show" id="splitAng2Val">-30</span> °</label>
                    <input type="range" min="-80" max="-10" value="-30" id="splitAng2">
                </div>
                <div class="desc">
                    F₁ = <span class="val-show" id="split1">--</span> N &nbsp;
                    F₂ = <span class="val-show" id="split2">--</span> N
                </div>
            </div>
        </div>
        <!-- 绘图画布 -->
        <div class="canvas-box">
            <canvas id="forceCanvas" width="700" height="460"></canvas>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('forceCanvas');
const ctx = canvas.getContext('2d');
const cx = canvas.width / 2;
const cy = canvas.height / 2;
const scale = 3;

// 切换标签
const tabAdd = document.getElementById('tabAdd');
const tabSplit = document.getElementById('tabSplit');
const ctrlAdd = document.getElementById('ctrlAdd');
const ctrlSplit = document.getElementById('ctrlSplit');
tabAdd.onclick = ()=>{
    tabAdd.classList.add('active');
    tabSplit.classList.remove('active');
    ctrlAdd.classList.remove('hide');
    ctrlSplit.classList.add('hide');
    drawAdd();
}
tabSplit.onclick = ()=>{
    tabAdd.classList.remove('active');
    tabSplit.classList.add('active');
    ctrlAdd.classList.add('hide');
    ctrlSplit.classList.remove('hide');
    drawSplit();
}

// 绘制矢量：角度数学标准（向上为正y），画布y自动反转
function drawVector(x0,y0,len,angleDeg,color,label){
    const rad = angleDeg * Math.PI / 180;
    const x1 = x0 + len * Math.cos(rad);
    // 画布y轴向下，所以数学正y 要减去
    const y1 = y0 - len * Math.sin(rad);
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.moveTo(x0,y0);
    ctx.lineTo(x1,y1);
    ctx.stroke();
    // 箭头
    const arrowLen = 12;
    const ang1 = rad + Math.PI*0.8;
    const ang2 = rad - Math.PI*0.8;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x1 + arrowLen*Math.cos(ang1), y1 - arrowLen*Math.sin(ang1));
    ctx.moveTo(x1,y1);
    ctx.lineTo(x1 + arrowLen*Math.cos(ang2), y1 - arrowLen*Math.sin(ang2));
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = "16px SimHei";
    ctx.fillText(label, x1+8, y1-8);
    return {x:x1, y:y1};
}
// 清空画布坐标轴
function clearBoard(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle="#aaa";
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(20,cy);ctx.lineTo(canvas.width-20,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,20);ctx.lineTo(cx,canvas.height-20);ctx.stroke();
}

// ========== 力的合成（修复合力Y轴反向） ==========
const f1 = document.getElementById('f1');
const ang1 = document.getElementById('ang1');
const f2 = document.getElementById('f2');
const ang2 = document.getElementById('ang2');
const f1Val = document.getElementById('f1Val');
const ang1Val = document.getElementById('ang1Val');
const f2Val = document.getElementById('f2Val');
const ang2Val = document.getElementById('ang2Val');
const totalAng = document.getElementById('totalAng');
const resAdd = document.getElementById('resAdd');

function drawAdd(){
    clearBoard();
    const F1 = Number(f1.value);
    const a1 = Number(ang1.value);
    const a2 = Number(ang2.value);
    const F2 = Number(f2.value);
    f1Val.textContent = F1;
    ang1Val.textContent = a1;
    f2Val.textContent = F2;
    ang2Val.textContent = a2;
    totalAng.textContent = (a1 - a2).toFixed(0);

    const r1 = a1 * Math.PI / 180;
    const r2 = a2 * Math.PI / 180;
    // 数学分量（标准坐标系，上+y）
    const x1 = F1 * Math.cos(r1);
    const y1 = F1 * Math.sin(r1);
    const x2 = F2 * Math.cos(r2);
    const y2 = F2 * Math.sin(r2);
    const Fx = x1 + x2;
    const Fy = y1 + y2;
    const F合 = Math.hypot(Fx, Fy);
    // 合力数学角度（向上为正）
    let Fang = Math.atan2(Fy, Fx) * 180 / Math.PI;
    resAdd.textContent = F合.toFixed(1);

    const p1 = drawVector(cx, cy, F1*scale, a1, "#00509d", "F₁");
    const p2 = drawVector(cx, cy, F2*scale, a2, "#d62828", "F₂");

    // 平行四边形辅助线
    ctx.setLineDash([6,4]);
    ctx.strokeStyle="#777";
    ctx.lineWidth=2;
    const endPx = cx + (p1.x - cx)+(p2.x - cx);
    const endPy = cy - ((p1.y - cy)/-1 + (p2.y - cy)/-1);
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(endPx, endPy);
    ctx.moveTo(p2.x,p2.y);
    ctx.lineTo(endPx, endPy);
    ctx.stroke();
    ctx.setLineDash([]);

    // 合力矢量（角度完全匹配分量，Y不再反转）
    drawVector(cx, cy, F合*scale, Fang, "#119911", "F合");
}
[f1,ang1,f2,ang2].forEach(el=>el.oninput = drawAdd);

// ========== 力的分解 ==========
const fTotal = document.getElementById('fTotal');
const splitAng1 = document.getElementById('splitAng1');
const splitAng2 = document.getElementById('splitAng2');
const fTotalVal = document.getElementById('fTotalVal');
const splitAng1Val = document.getElementById('splitAng1Val');
const splitAng2Val = document.getElementById('splitAng2Val');
const split1 = document.getElementById('split1');
const split2 = document.getElementById('split2');

function drawSplit(){
    clearBoard();
    const Ftotal = Number(fTotal.value);
    const a1 = Number(splitAng1.value);
    const a2 = Number(splitAng2.value);
    fTotalVal.textContent = Ftotal;
    splitAng1Val.textContent = a1;
    splitAng2Val.textContent = a2;

    const r1 = a1 * Math.PI / 180;
    const r2 = a2 * Math.PI / 180;
    const angleBetween = r1 - r2;
    const F1 = Ftotal * Math.sin(-r2) / Math.sin(angleBetween);
    const F2 = Ftotal * Math.sin(r1) / Math.sin(angleBetween);
    split1.textContent = F1.toFixed(1);
    split2.textContent = F2.toFixed(1);

    drawVector(cx, cy, Ftotal*scale, 0, "#119911", "F合");
    const p1 = drawVector(cx, cy, Math.abs(F1)*scale, a1, "#00509d", "F₁");
    const p2 = drawVector(cx, cy, Math.abs(F2)*scale, a2, "#d62828", "F₂");

    ctx.setLineDash([6,4]);
    ctx.strokeStyle="#777";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(cx + Ftotal*scale, cy);
    ctx.moveTo(p2.x,p2.y);
    ctx.lineTo(cx + Ftotal*scale, cy);
    ctx.stroke();
    ctx.setLineDash([]);
}
[fTotal,splitAng1,splitAng2].forEach(el=>el.oninput = drawSplit);

window.onload = drawAdd;
</script>
</body>
</html>
